[package]
name = "rust-agent-spill"
description = "Bounded Agent-owned spill storage capability contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent.build-requirements]
schema = 1
executables = []
read-inputs = []
environment = []

[[package.metadata.rust-agent.capability]]
id = "cap:spill-store"
api = "rust_agent_spill::SpillStore"
binding-type = "rust_agent_spill::SpillStoreBinding"
binding-adapter = "rust_agent_spill::SpillStoreBinding::from_provider"
binding = "singleton"
scope = "agent"

[features]
default = []

[dependencies]
rust-agent-core = { version = "0.1.0", path = "../rust-agent-core", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../rust-agent-runtime-api", default-features = false }
sha2.workspace = true

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
