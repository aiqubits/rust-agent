[package]
name = "rust-agent-runtime-api"
description = "Effect-free runtime ownership and lifecycle contracts for rust-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent.build-requirements]
schema = 1
executables = []
read-inputs = []
environment = []

[[package.metadata.rust-agent.capability]]
id = "cap:lifecycle-observer"
api = "rust_agent_runtime_api::LifecycleObserver"
binding-type = "rust_agent_runtime_api::LifecycleObserverBinding"
binding-adapter = "rust_agent_runtime_api::LifecycleObserverBinding::from_provider"
binding = "ordered-multi"
scope = "app"

[features]
default = []

[dependencies]
rust-agent-core = { version = "0.1.0", path = "../rust-agent-core", default-features = false }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
