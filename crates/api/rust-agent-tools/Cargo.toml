[package]
name = "rust-agent-tools"
description = "Bounded tool contracts and guarded tool capability boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent.build-requirements]
schema = 1
executables = []
read-inputs = []
environment = []

[[package.metadata.rust-agent.capability]]
id = "cap:tool-provider"
api = "rust_agent_tools::ToolContribution"
binding-type = "rust_agent_tools::ToolProviderBinding"
binding-adapter = "rust_agent_tools::ToolProviderBinding::from_provider"
binding = "ordered-multi"
scope = "agent"

[[package.metadata.rust-agent.capability]]
id = "cap:tool-executor"
api = "rust_agent_tools::ToolExecutor"
binding-type = "rust_agent_tools::ToolExecutorBinding"
binding-adapter = "rust_agent_tools::ToolExecutorBinding::from_provider"
binding = "singleton"
scope = "agent"

[features]
default = []

[dependencies]
rust-agent-core = { version = "0.1.0", path = "../rust-agent-core", default-features = false }
rust-agent-policy = { version = "0.1.0", path = "../rust-agent-policy", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../rust-agent-runtime-api", default-features = false }
serde_json = "1.0.143"
sha2 = "0.10.9"

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
trybuild = "1.0.110"

[lints]
workspace = true
