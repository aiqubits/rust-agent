[package]
name = "rust-agent-attachments"
description = "Bounded durable attachment capability contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent.build-requirements]
schema = 1
executables = []
read-inputs = []
environment = []

[[package.metadata.rust-agent.capability]]
id = "cap:attachment-store"
api = "rust_agent_attachments::AttachmentStore"
binding-type = "rust_agent_attachments::AttachmentStoreBinding"
binding-adapter = "rust_agent_attachments::AttachmentStoreBinding::from_provider"
binding = "registry"
scope = "app"

[features]
default = []

[dependencies]
rust-agent-core = { version = "0.1.0", path = "../rust-agent-core", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../rust-agent-runtime-api", default-features = false }
sha2.workspace = true

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
