[package]
name = "rust-agent-cli"
description = "Composition control plane for rust-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rust-agent"
path = "src/main.rs"

[features]
default = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
rust-agent-build-executor = { version = "0.1.0", path = "../../composition/rust-agent-build-executor", default-features = false }
rust-agent-composition = { version = "0.1.0", path = "../../composition/rust-agent-composition", default-features = false }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
walkdir.workspace = true

[lints]
workspace = true
