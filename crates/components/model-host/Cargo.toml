[package]
name = "rust-agent-model-host"
description = "Host-bridged language model Component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent]
schema = 1
id = "model-host"
scope = "app"
factory = "rust_agent_model_host::build"
dependencies-type = "rust_agent_model_host::Dependencies"
config-type = "rust_agent_model_host::host_api::Config"
config-source = "host"
config-key = "model-host"
host-api = "rust_agent_model_host::host_api"
targets = ["cfg(true)"]
target-support = [
    { predicate = 'cfg(target_os = "linux")', tier = "production" },
    { predicate = 'cfg(not(target_os = "linux"))', tier = "experimental" },
]
lifecycle-effects = []
provides = [{ capability = "cap:model", key = "host", priority = 50, effects = ["host-bridge"] }]
requires = []
conflicts = []
security = ["host-bridge"]
runtime-primitives = []
build-requirements = { executables = [], read-inputs = [], environment = [] }
app-coexistence = { mode = "concurrent-shared-host-handle", host-config-fields = ["model-host.model"], evidence = { source = "coexistence-evidence.toml", algorithm = "sha256", digest = "83721ebf9598ea0de89e530f9bbfc3f04bb8485b53df5852bcba92ace19a8dae", reviewer-policy = "phase-2-runtime-review-v1" } }
cargo-features = []

[features]
default = []

[dependencies]
rust-agent-model = { version = "0.1.0", path = "../../api/rust-agent-model", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../api/rust-agent-runtime-api", default-features = false }

[lints]
workspace = true
