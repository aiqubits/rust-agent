[package]
name = "rust-agent-tool-shell"
description = "Provider-neutral bounded shell Tool Component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent]
schema = 1
id = "tool-shell"
scope = "agent"
factory = "rust_agent_tool_shell::build"
dependencies-type = "rust_agent_tool_shell::Dependencies"
config-type = "rust_agent_tool_shell::Config"
config-source = "none"
targets = ["cfg(true)"]
target-support = [
  { predicate = 'cfg(target_os = "linux")', tier = "production" },
  { predicate = 'cfg(not(target_os = "linux"))', tier = "experimental" },
]
lifecycle-effects = []
provides = [{ capability = "cap:tool-provider", order = 200, effects = [] }]
requires = [{ capability = "cap:shell", mode = "required", field = "shell" }]
conflicts = []
security = []
runtime-primitives = []
build-requirements = { executables = [], read-inputs = [], environment = [] }
cargo-features = []

[features]
default = []

[dependencies]
rust-agent-fs = { version = "0.1.0", path = "../../api/rust-agent-fs", default-features = false }
rust-agent-policy = { version = "0.1.0", path = "../../api/rust-agent-policy", default-features = false }
rust-agent-process = { version = "0.1.0", path = "../../api/rust-agent-process", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../api/rust-agent-runtime-api", default-features = false }
rust-agent-tools = { version = "0.1.0", path = "../../api/rust-agent-tools", default-features = false }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rust-agent-core = { version = "0.1.0", path = "../../api/rust-agent-core", default-features = false }

[lints]
workspace = true
