[package]
name = "rust-agent-subprocess-local"
description = "Fail-closed Linux local subprocess Component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.rust-agent]
schema = 1
id = "subprocess-local"
scope = "agent"
factory = "rust_agent_subprocess_local::build"
dependencies-type = "rust_agent_subprocess_local::Dependencies"
config-type = "rust_agent_subprocess_local::Config"
config-key = "subprocess-local"
config-source = "file"
targets = ['cfg(target_os = "linux")']
support = "production"
lifecycle-effects = ["read-local", "process-exec"]
provides = [{ capability = "cap:subprocess", priority = 100, effects = ["read-local", "write-local", "process-exec"] }]
requires = [{ capability = "cap:confinement-verifier", mode = "required", field = "confinement_verifier" }]
conflicts = []
security = ["read-local", "write-local", "process-exec"]
runtime-primitives = ["clock", "sleeper"]
build-requirements = { executables = [], read-inputs = [], environment = [] }
cargo-features = []

[features]
default = []

[dependencies]
landlock.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["resource", "term"] }
rust-agent-core = { version = "0.1.0", path = "../../api/rust-agent-core", default-features = false }
rust-agent-policy = { version = "0.1.0", path = "../../api/rust-agent-policy", default-features = false }
rust-agent-process = { version = "0.1.0", path = "../../api/rust-agent-process", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../api/rust-agent-runtime-api", default-features = false }
rustix = { workspace = true, features = ["process", "termios"] }
seccompy.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
rust-agent-fs = { version = "0.1.0", path = "../../api/rust-agent-fs", default-features = false }
rust-agent-sandbox-linux = { version = "0.1.0", path = "../sandbox-linux", default-features = false }
rust-agent-runtime-tokio = { version = "0.1.0", path = "../../runtime/rust-agent-runtime-tokio", default-features = false }

[lints]
workspace = true
