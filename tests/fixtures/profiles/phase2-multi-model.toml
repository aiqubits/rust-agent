schema = 1
name = "phase2-multi-model"
build-kind = "library"
target = "x86_64-unknown-linux-gnu"
environment = "server"
support-tier = "production"
runtime-adapter = "runtime-tokio"
resolver-decision-budget = 100
denied-effects = ["code-execution", "network-outbound", "persistent-storage", "process-exec", "read-local", "remote-execution", "secret-access", "write-local"]

[components]
driver-direct = "enabled"
model-replay = "enabled"
model-host = "enabled"
lifecycle-observer-noop = "enabled"
fixture-driver = "disabled"
fixture-model = "disabled"
fixture-model-fallback = "disabled"
fixture-model-shared = "disabled"
fixture-fs-read = "disabled"
fixture-build-proof = "disabled"
