schema = 1
name = "phase2-wasm-observer-invalid"
build-kind = "library"
target = "wasm32-unknown-unknown"
environment = "browser"
support-tier = "experimental"
runtime-adapter = "runtime-wasm"
resolver-decision-budget = 100
denied-effects = ["code-execution", "host-bridge", "network-outbound", "persistent-storage", "process-exec", "read-local", "remote-execution", "secret-access", "write-local"]

[components]
driver-direct = "enabled"
model-replay = "enabled"
model-host = "disabled"
lifecycle-observer-noop = "enabled"
fixture-driver = "disabled"
fixture-model = "disabled"
fixture-model-fallback = "disabled"
fixture-model-shared = "disabled"
fixture-fs-read = "disabled"
fixture-build-proof = "disabled"
