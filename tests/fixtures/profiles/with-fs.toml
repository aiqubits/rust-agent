schema = 1
name = "fixture-with-fs"
build-kind = "library"
target = "x86_64-unknown-linux-gnu"
environment = "desktop"
support-tier = "production"
runtime-adapter = "fixture-runtime"
resolver-decision-budget = 100
denied-effects = ["code-execution", "host-bridge", "network-outbound", "persistent-storage", "process-exec", "remote-execution", "secret-access", "write-local"]

[components]
fixture-driver = "enabled"
fixture-model = "auto"
fixture-model-fallback = "auto"
fixture-fs-read = "enabled"
fixture-build-proof = "disabled"
