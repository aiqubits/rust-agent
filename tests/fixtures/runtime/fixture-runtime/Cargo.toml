description = "Effect-free runtime adapter fixture for generated compositions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent.runtime-adapter]
schema = 1
id = "fixture-runtime"
constructor = "rust_agent_fixture_runtime::create_runtime_primitives"
