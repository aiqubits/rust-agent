[package]
name = "rust-agent-fixture-driver"
description = "Product-neutral direct driver fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent]
schema = 1
id = "fixture-driver"
scope = "app"
factory = "rust_agent_fixture_driver::build"
dependencies-type = "rust_agent_fixture_driver::Dependencies"
config-type = "rust_agent_fixture_driver::Config"
config-source = "none"
targets = ["cfg(true)"]
support = "production"
lifecycle-effects = []
provides = [{ capability = "cap:driver", priority = 100, effects = [] }]
requires = [{ capability = "cap:model", mode = "required", field = "model" }]
conflicts = []
security = []
runtime-primitives = []
build-requirements = { executables = [], read-inputs = [], environment = [] }
app-coexistence = { mode = "concurrent-independent", evidence = { source = "coexistence-evidence.toml", algorithm = "sha256", digest = "708938236a72e999075c6a75a37a32cf249039e7cf206d52f7e1d4a05a405c14", reviewer-policy = "phase-1a-fixture-review-v1" } }
cargo-features = []

[features]
default = []

[dependencies]
rust-agent-fixture-api = { version = "0.1.0", path = "../../api/fixture-api", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../../../crates/api/rust-agent-runtime-api", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rust-agent-fixture-target-native = { version = "0.1.0", path = "../../helpers/fixture-target-native", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rust-agent-fixture-target-wasm = { version = "0.1.0", path = "../../helpers/fixture-target-wasm", default-features = false }

[lints]
workspace = true
