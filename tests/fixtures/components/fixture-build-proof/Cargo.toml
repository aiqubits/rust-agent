[package]
name = "rust-agent-fixture-build-proof"
description = "Controlled build-requirement accounting fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent]
schema = 1
id = "fixture-build-proof"
scope = "app"
factory = "rust_agent_fixture_build_proof::build"
dependencies-type = "rust_agent_fixture_build_proof::Dependencies"
config-type = "rust_agent_fixture_build_proof::Config"
config-source = "none"
targets = ["cfg(true)"]
support = "production"
lifecycle-effects = []
provides = [{ capability = "cap:build-proof", priority = 100, effects = [] }]
requires = []
conflicts = []
security = []
runtime-primitives = []
build-requirements = { executables = ["fixture-codegen"], read-inputs = ["fixture-sdk"], environment = [] }
app-coexistence = { mode = "requires-stop" }
cargo-features = []

[features]
default = []

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
rust-agent-fixture-api = { version = "0.1.0", path = "../../api/fixture-api", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../../../crates/api/rust-agent-runtime-api", default-features = false }

[lints]
workspace = true
