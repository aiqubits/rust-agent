[package]
name = "rust-agent-fixture-fs-read"
description = "Product-neutral optional filesystem capability fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent]
schema = 1
id = "fixture-fs-read"
scope = "app"
factory = "rust_agent_fixture_fs_read::build"
dependencies-type = "rust_agent_fixture_fs_read::Dependencies"
config-type = "rust_agent_fixture_fs_read::Config"
config-source = "none"
targets = ['cfg(not(target_arch = "wasm32"))']
support = "production"
lifecycle-effects = []
provides = [{ capability = "cap:fs-read", priority = 100, effects = ["read-local"] }]
requires = []
conflicts = []
security = ["read-local"]
runtime-primitives = []
build-requirements = { executables = [], read-inputs = [], environment = [] }
app-coexistence = { mode = "requires-stop" }
cargo-features = []

[features]
default = []

[dependencies]
rust-agent-fixture-api = { version = "0.1.0", path = "../../api/fixture-api", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../../../crates/api/rust-agent-runtime-api", default-features = false }

[lints]
workspace = true
