[package]
name = "rust-agent-fixture-model-fallback"
description = "Higher-priority conflicting model used to prove resolver backtracking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent]
schema = 1
id = "fixture-model-fallback"
scope = "app"
factory = "rust_agent_fixture_model_fallback::build"
dependencies-type = "rust_agent_fixture_model_fallback::Dependencies"
config-type = "rust_agent_fixture_model_fallback::Config"
config-source = "none"
targets = ["cfg(true)"]
support = "production"
lifecycle-effects = []
provides = [{ capability = "cap:model", priority = 200, effects = [] }]
requires = []
conflicts = ["fixture-driver"]
security = []
runtime-primitives = []
build-requirements = { executables = [], read-inputs = [], environment = [] }
app-coexistence = { mode = "requires-stop" }
cargo-features = []

[features]
default = []

[dependencies]
rust-agent-fixture-api = { version = "0.1.0", path = "../../api/fixture-api", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../../../crates/api/rust-agent-runtime-api", default-features = false }

[lints]
workspace = true
