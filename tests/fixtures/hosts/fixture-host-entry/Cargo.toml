[package]
name = "rust-agent-fixture-host-entry"
description = "Framework-neutral native Host entry ABI fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent.host-entry]
schema = 1
id = "fixture-host-entry"
entry = "rust_agent_fixture_host_entry::run"
targets = ['cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))']
target-support = [
    { predicate = 'cfg(target_os = "linux")', tier = "production" },
    { predicate = 'cfg(any(target_os = "macos", target_os = "windows"))', tier = "experimental" },
]
security = ["host-bridge"]
runtime-adapters = ["fixture-runtime"]
build-requirements = { executables = [], read-inputs = [], environment = [] }

[features]
default = []

[dependencies]
rust-agent-fixture-api = { version = "0.1.0", path = "../../api/fixture-api", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../../../crates/api/rust-agent-runtime-api", default-features = false }

[lints]
workspace = true
