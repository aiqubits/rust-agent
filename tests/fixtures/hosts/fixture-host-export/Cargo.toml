[package]
name = "rust-agent-fixture-host-export"
description = "Framework-neutral WASM Host export helper ABI fixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.rust-agent.host-export]
schema = 1
id = "fixture-host-export"
export-module = "rust_agent_fixture_host_export"
targets = ['cfg(target_arch = "wasm32")']
support = "production"
security = ["host-bridge"]
runtime-adapters = ["fixture-runtime"]
build-requirements = { executables = ["wasm-bindgen-cli"], read-inputs = [], environment = [] }

[features]
default = []

[dependencies]
rust-agent-fixture-api = { version = "0.1.0", path = "../../api/fixture-api", default-features = false }
rust-agent-runtime-api = { version = "0.1.0", path = "../../../../crates/api/rust-agent-runtime-api", default-features = false }
wasm-bindgen = { version = "=0.2.127", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.77", default-features = false, features = ["std"] }

[lints]
workspace = true
