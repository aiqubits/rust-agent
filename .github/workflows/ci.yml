name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy,rust-src
          targets: wasm32-unknown-unknown,aarch64-linux-android,aarch64-apple-ios,x86_64-apple-darwin,x86_64-pc-windows-msvc
      - name: Verify pinned Rust and Cargo versions
        shell: bash
        run: |
          rustc --version | grep -E '^rustc 1\.97\.1 '
          cargo --version | grep -E '^cargo 1\.97\.1 '
      - uses: Swatinem/rust-cache@v2
      - name: Prepare pinned custom-target sysroot cache
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo fetch --locked --manifest-path "$(rustc --print sysroot)/lib/rustlib/src/rust/library/Cargo.toml"
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Verify pinned wasm-bindgen CLI version
        run: wasm-bindgen --version | grep -E '^wasm-bindgen 0\.2\.127$'
      - name: Verify browser-local runtime cancellation
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p rust-agent-runtime-wasm --target wasm32-unknown-unknown --all-features
      - name: Verify exact Phase 0/1A/1B/2 identities and Phase 3 evidence
        run: cargo test -p rust-agent-cli --test architecture phase_zero_through_three_acceptance_mappings_are_exact_complete_and_runnable -- --exact
      - name: Verify Phase 3 acceptance completion
        run: cargo test -p rust-agent-cli --test architecture phase_three_acceptance_mapping_is_complete_and_generated -- --exact
      - name: Verify Phase 3 generated Tool composition
        run: cargo test -p rust-agent-composition generator::tests::phase_three_tool_composition_is_generated_built_and_graph_exact -- --exact
      - name: Verify Phase 4 acceptance completion
        run: cargo test -p rust-agent-cli --test architecture phase_four_acceptance_mapping_is_complete_and_generated -- --exact
      - name: Verify Phase 4 generated local composition
        run: cargo test -p rust-agent-composition generator::tests::phase_four_local_composition_is_deterministic_graph_exact_and_lifecycle_owned -- --exact
      - name: Build pinned-toolchain custom-target composition
        run: cargo test -p rust-agent-cli --test e2e pinned_toolchain_custom_target_compose_lock_build_end_to_end -- --exact
      - name: Verify Phase 2 API dependency closures
        run: |
          cargo check -p rust-agent-core --no-default-features
          cargo check -p rust-agent-runtime-api --no-default-features
          cargo check -p rust-agent-session --no-default-features
          cargo check -p rust-agent-agent --no-default-features
          cargo check -p rust-agent-session --no-default-features --features development
          cargo check -p rust-agent-agent --no-default-features --features development
          cargo check -p rust-agent-session --all-features
          cargo check -p rust-agent-agent --all-features
      - name: Verify Phase 2 claimed target matrix
        shell: bash
        run: |
          phase2_packages=(
            -p rust-agent-core
            -p rust-agent-runtime-api
            -p rust-agent-session
            -p rust-agent-model
            -p rust-agent-commands
            -p rust-agent-agent
            -p rust-agent-model-replay
            -p rust-agent-model-host
            -p rust-agent-driver-direct
            -p rust-agent-lifecycle-observer-noop
            -p rust-agent-runtime-wasm
          )
          cargo check --target wasm32-unknown-unknown --all-features "${phase2_packages[@]}"
          for target in aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features "${phase2_packages[@]}" -p rust-agent-runtime-tokio
          done
      - name: Verify Phase 3 API dependency closures
        run: |
          cargo check -p rust-agent-commands --no-default-features
          cargo check -p rust-agent-tools --no-default-features
          cargo check -p rust-agent-policy --no-default-features
          cargo check -p rust-agent-prompt --no-default-features
          cargo check -p rust-agent-attachments --no-default-features
          cargo check -p rust-agent-spill --no-default-features
          cargo check -p rust-agent-telemetry --no-default-features
          cargo check -p rust-agent-tool-executor-guarded --no-default-features
          cargo check -p rust-agent-driver-tools --no-default-features
          cargo check -p rust-agent-commands --all-features
          cargo check -p rust-agent-tools --all-features
          cargo check -p rust-agent-policy --all-features
          cargo check -p rust-agent-prompt --all-features
          cargo check -p rust-agent-attachments --all-features
          cargo check -p rust-agent-spill --all-features
          cargo check -p rust-agent-telemetry --all-features
          cargo check -p rust-agent-tool-executor-guarded --all-features
          cargo check -p rust-agent-driver-tools --all-features
      - name: Verify Phase 3 target matrix
        shell: bash
        run: |
          phase3_packages=(
            -p rust-agent-commands
            -p rust-agent-tools
            -p rust-agent-policy
            -p rust-agent-prompt
            -p rust-agent-attachments
            -p rust-agent-spill
            -p rust-agent-telemetry
            -p rust-agent-permission-default
            -p rust-agent-tool-executor-guarded
            -p rust-agent-driver-tools
          )
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features "${phase3_packages[@]}"
          done
      - name: Verify Phase 4 filesystem API dependency closure
        run: |
          cargo check -p rust-agent-fs --no-default-features
          cargo check -p rust-agent-fs --all-features
      - name: Verify Phase 4 filesystem API target matrix
        shell: bash
        run: |
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features -p rust-agent-fs
          done
      - name: Verify Phase 4 process API dependency closures
        run: |
          cargo check -p rust-agent-policy --no-default-features
          cargo check -p rust-agent-policy --all-features
          cargo check -p rust-agent-process --no-default-features
          cargo check -p rust-agent-process --all-features
          cargo tree -p rust-agent-process --edges normal --no-default-features
      - name: Verify Phase 4 process API target matrix
        shell: bash
        run: |
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features -p rust-agent-policy -p rust-agent-process
          done
      - name: Verify Phase 4 process API contracts
        run: cargo test -p rust-agent-policy -p rust-agent-process --all-targets --all-features
      - name: Verify Phase 4 Linux sandbox planner closure
        run: |
          cargo check -p rust-agent-sandbox-linux --no-default-features
          cargo check -p rust-agent-sandbox-linux --all-features
          cargo tree -p rust-agent-sandbox-linux --edges normal --no-default-features
      - name: Verify Phase 4 Linux sandbox planner contracts
        run: cargo test -p rust-agent-sandbox-linux --all-targets --all-features
      - name: Verify Phase 4 Linux subprocess closure
        run: |
          cargo check -p rust-agent-subprocess-local --no-default-features
          cargo check -p rust-agent-subprocess-local --all-features
          cargo tree -p rust-agent-subprocess-local --edges normal --no-default-features
      - name: Verify Phase 4 Linux subprocess contracts
        run: cargo test -p rust-agent-subprocess-local --all-targets --all-features
      - name: Verify Phase 4 local shell closure
        run: |
          cargo check -p rust-agent-shell-local --no-default-features
          cargo check -p rust-agent-shell-local --all-features
          cargo tree -p rust-agent-shell-local --edges normal --no-default-features
      - name: Verify Phase 4 local shell contracts
        run: cargo test -p rust-agent-shell-local --all-targets --all-features
      - name: Verify Phase 4 local terminal closure
        run: |
          cargo check -p rust-agent-terminal-local --no-default-features
          cargo check -p rust-agent-terminal-local --all-features
          cargo tree -p rust-agent-terminal-local --edges normal --no-default-features
      - name: Verify Phase 4 local terminal contracts
        run: cargo test -p rust-agent-process -p rust-agent-subprocess-local -p rust-agent-terminal-local --all-targets --all-features
      - name: Verify Phase 4 resource namespace dependency closures
        run: |
          cargo check -p rust-agent-resource-namespace --no-default-features
          cargo check -p rust-agent-resource-namespace --all-features
          cargo check -p rust-agent-resource-namespace-bootstrap-local --no-default-features
          cargo check -p rust-agent-resource-namespace-bootstrap-local --all-features
      - name: Verify Phase 4 resource namespace API target matrix
        shell: bash
        run: |
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features -p rust-agent-resource-namespace
          done
      - name: Verify Phase 4 real Linux local namespace bootstrap
        run: cargo test -p rust-agent-resource-namespace-bootstrap-local --all-targets --all-features
      - name: Verify Phase 4 filesystem provider dependency closures
        run: |
          cargo check -p rust-agent-fs-read-local --no-default-features
          cargo check -p rust-agent-fs-read-local --all-features
          cargo check -p rust-agent-fs-local --no-default-features
          cargo check -p rust-agent-fs-local --all-features
          cargo check -p rust-agent-tool-fs --no-default-features
          cargo check -p rust-agent-tool-fs --all-features
          cargo tree -p rust-agent-tool-fs --edges normal --no-default-features
      - name: Verify Phase 4 tool-fs target matrix
        shell: bash
        run: |
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features -p rust-agent-tool-fs
          done
      - name: Verify Phase 4 real Linux filesystem providers
        run: cargo test -p rust-agent-fs-read-local -p rust-agent-fs-local -p rust-agent-tool-fs --all-targets --all-features
      - name: Verify Phase 4 filesystem resolver projection
        run: cargo test -p rust-agent-composition resolver::tests::optional_tool_provider_is_order_independent_and_inherits_exact_fs_effects -- --exact
      - name: Verify Phase 4 tool-shell closure
        run: |
          cargo check -p rust-agent-tool-shell --no-default-features
          cargo check -p rust-agent-tool-shell --all-features
          cargo tree -p rust-agent-tool-shell --edges normal --no-default-features
      - name: Verify Phase 4 tool-shell target matrix
        shell: bash
        run: |
          for target in wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo check --target "$target" --all-features -p rust-agent-tool-shell
          done
      - name: Verify Phase 4 tool-shell contracts
        run: cargo test -p rust-agent-tool-shell --all-targets --all-features
      - name: Verify Phase 4 shell-tool resolver projection
        run: cargo test -p rust-agent-composition resolver::tests::shell_tool_selects_only_the_shell_capability_and_inherits_its_exact_effects -- --exact
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  phase-1b-linux-production:
    name: Phase 1B Linux production gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy,rust-src
          targets: wasm32-unknown-unknown,aarch64-linux-android,aarch64-apple-ios,x86_64-apple-darwin,x86_64-pc-windows-msvc
      - name: Install Phase 1B Linux runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap iproute2 openssl python3
      - name: Enable unprivileged user namespaces for the reference runner
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl --write kernel.unprivileged_userns_clone=1
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Prefetch locked Phase 1B fixture sources
        run: cargo fetch --locked
      - name: Build production CLI for process-level inspection
        run: cargo build -p rust-agent-cli
      - name: Verify real Landlock ABI 2 rename enforcement
        run: cargo test -p rust-agent-build-executor --test linux_sandbox_launcher writable_root_allows_internal_atomic_rename_but_not_escape -- --ignored --exact --test-threads=1
      - name: Verify real namespace and descendant escape matrix
        run: cargo test -p rust-agent-build-executor --test linux_namespace_backend -- --ignored --test-threads=1
      - name: Verify real Phase 4 subprocess confinement and teardown
        run: cargo test -p rust-agent-subprocess-local --test linux_subprocess real_linux_subprocess_enforces_anchor_handshake_budget_and_cancellation -- --ignored --exact --test-threads=1
      - name: Verify trusted fetch planner build Host and WASM pipelines
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          if cargo test -p rust-agent-build-executor --test production_cargo_fetch -- --ignored --test-threads=1 2>&1 | tee "$log_file"; then
            exit 0
          fi
          failure="$(tail -n 80 "$log_file")"
          failure="${failure//'%'/'%25'}"
          failure="${failure//$'\r'/'%0D'}"
          failure="${failure//$'\n'/'%0A'}"
          printf '::error title=Phase 1B trusted pipeline failure::%s\n' "$failure"
          exit 1
        env:
          RUST_AGENT_CLI_BIN: ${{ github.workspace }}/target/debug/rust-agent
