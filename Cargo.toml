[workspace]
members = [
    "crates/api/rust-agent-core",
    "crates/api/rust-agent-runtime-api",
    "crates/api/rust-agent-resource-namespace",
    "crates/api/rust-agent-fs",
    "crates/api/rust-agent-process",
    "crates/api/rust-agent-session",
    "crates/api/rust-agent-model",
    "crates/api/rust-agent-tools",
    "crates/api/rust-agent-policy",
    "crates/api/rust-agent-prompt",
    "crates/api/rust-agent-attachments",
    "crates/api/rust-agent-spill",
    "crates/api/rust-agent-telemetry",
    "crates/api/rust-agent-commands",
    "crates/api/rust-agent-agent",
    "crates/components/model-replay",
    "crates/components/model-host",
    "crates/components/driver-direct",
    "crates/components/driver-tools",
    "crates/components/permission-default",
    "crates/components/tool-executor-guarded",
    "crates/components/lifecycle-observer-noop",
    "crates/components/resource-namespace-bootstrap-local",
    "crates/components/fs-read-local",
    "crates/components/fs-local",
    "crates/components/tool-fs",
    "crates/components/sandbox-linux",
    "crates/components/subprocess-local",
    "crates/components/shell-local",
    "crates/runtime/rust-agent-runtime-tokio",
    "crates/runtime/rust-agent-runtime-wasm",
    "crates/composition/rust-agent-composition",
    "crates/composition/rust-agent-build-executor",
    "crates/control/rust-agent-cli",
    "tests/fixtures/api/fixture-api",
    "tests/fixtures/components/fixture-driver",
    "tests/fixtures/components/fixture-build-proof",
    "tests/fixtures/components/fixture-fs-read",
    "tests/fixtures/components/fixture-model",
    "tests/fixtures/components/fixture-model-fallback",
    "tests/fixtures/components/fixture-model-shared",
    "tests/fixtures/helpers/fixture-target-native",
    "tests/fixtures/helpers/fixture-target-wasm",
    "tests/fixtures/runtime/fixture-runtime",
    "tests/fixtures/hosts/fixture-host-entry",
    "tests/fixtures/hosts/fixture-host-export",
]
default-members = [
    "crates/api/rust-agent-core",
    "crates/api/rust-agent-runtime-api",
    "crates/api/rust-agent-resource-namespace",
    "crates/api/rust-agent-fs",
    "crates/api/rust-agent-process",
    "crates/api/rust-agent-session",
    "crates/api/rust-agent-model",
    "crates/api/rust-agent-tools",
    "crates/api/rust-agent-policy",
    "crates/api/rust-agent-prompt",
    "crates/api/rust-agent-attachments",
    "crates/api/rust-agent-spill",
    "crates/api/rust-agent-telemetry",
    "crates/api/rust-agent-commands",
    "crates/api/rust-agent-agent",
    "crates/components/model-replay",
    "crates/components/model-host",
    "crates/components/driver-direct",
    "crates/components/driver-tools",
    "crates/components/permission-default",
    "crates/components/tool-executor-guarded",
    "crates/components/lifecycle-observer-noop",
    "crates/components/resource-namespace-bootstrap-local",
    "crates/components/fs-read-local",
    "crates/components/fs-local",
    "crates/components/tool-fs",
    "crates/components/sandbox-linux",
    "crates/components/subprocess-local",
    "crates/components/shell-local",
    "crates/runtime/rust-agent-runtime-tokio",
    "crates/runtime/rust-agent-runtime-wasm",
    "crates/composition/rust-agent-composition",
    "crates/composition/rust-agent-build-executor",
    "crates/control/rust-agent-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/aiqubits/rust-agent"

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive"] }
ed25519-dalek = "2.2.0"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
git2 = { version = "0.21.0", default-features = false }
globset = "0.4.19"
hex = "0.4.3"
ignore = "0.4.31"
landlock = "0.4.7"
libc = "0.2.189"
nix = { version = "0.30.1", features = ["process", "ptrace", "signal"] }
proptest = "1.7.0"
regex = "1.12.4"
renamore = { version = "0.3.2", features = ["always-supported"] }
rustix = { version = "1.1.4", features = ["fs"] }
seccompy = "0.1.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_jcs = "0.1.0"
sha2 = "0.10.9"
tempfile = "3.21.0"
tar = { version = "0.4.44", default-features = false }
thiserror = "2.0.16"
tokio = { version = "1.47.1", default-features = false, features = ["rt", "time"] }
toml = "0.9.5"
trybuild = "1.0.110"
walkdir = "2.5.0"
wasm-bindgen = { version = "=0.2.127", default-features = false, features = ["std"] }
wasm-bindgen-futures = { version = "=0.4.77", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
format_push_string = "allow"

# Composition provenance hashes a bounded pinned sysroot once per process. Keep the
# cryptographic compression implementation optimized in development/test profiles so
# a security check over large toolchain files does not become prohibitively slow.
[profile.dev.package.sha2]
opt-level = 3
